# 到位（front_marker_control 进入 POS_HOLD）自动读码（日常调参入口，修改后重启节点生效）。
# 本节点只做「进入 POS_HOLD -> 按 mode 读一次 -> 发布 ~result」，
# 到位判定、失败重试、兜底策略都不在这里。

# ---- 输入 ----
# 到位信号：front_marker_control 的模式话题（std_msgs/String，latch，只在模式变化时发布）
control_mode_topic: /front_marker_control/control_mode
# 飞行门控状态（connected + armed + OFFBOARD 且新鲜才读码）
state_topic: /mavros/state
state_timeout_s: 2.0    # 超过这么久收不到 /mavros/state 视为状态不新鲜，放弃本次到位
# marker id 来源：到位时刻该话题上最新的一条消息
transform_topic: /ov13855_apriltag_vision/debug/homogeneous_transform
# marker 消息最大年龄（s）：跳变时刻 0.5 s 内没有新消息就写 -1
marker_timeout_s: 0.5

# ---- 读码 ----
# mode 用 launch 参数 mode:= 指定（camera 默认 / serial / both）；
# 串口读码器参数在 serial.yaml，只在 mode 为 serial / both 时加载。
camera_service: /barcode_reader_camera/decode
service_wait_s: 0.5    # 服务不在线时最多等多久，超时跳过该读码器

# ---- 记录 ----
# 每次到位读码往 arrival_read.csv 追加一行（tag 位置 + 结果），放在相机读码节点这次启动的文件夹里
# （和图片、attempts.csv 一起）；只跑 serial 时在 csv_dir 下按启动时间另建文件夹。第一次读码才建文件。留空不写
csv_dir: ~/test_data/barcode

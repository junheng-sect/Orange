transport: tcp
# Automatically enable once localization and TCP are ready after startup.
auto_enable: true
tcp:
  host: 192.168.31.87
  port: 8080
  timeout_sec: 0.5
  resend_sec: 1.0
odom_topic: /fastlio/odom_world
status_rate_hz: 20.0
controller:
  frame_id: drone_odom
  child_frame_id: drone_base
  # Fixed ground cable exit in frame_id. Must be measured before handheld use.
  anchor: [0.0, 0.0, 0.0]
  # Cable attachment relative to the lidar IMU position origin, in body axes.
  attachment_offset: [0.0, 0.0, 0.0]
  # Integer device units, inclusive range 0..500. Restart node after edits.
  low_duty: 10
  high_duty: 220
  fallback_duty: 100
  window_sec: 0.3
  min_samples: 3
  enter_speed_mps: -0.05
  exit_speed_mps: -0.02
  enter_hold_sec: 0.15
  timeout_sec: 0.5
  future_tolerance_sec: 0.05
  near_anchor_m: 0.1
  # Handheld-test plausibility envelope, not a universal flight limit.
  max_position_speed_mps: 3.0
  position_jump_slack_m: 0.05
  max_samples: 1000

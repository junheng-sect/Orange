# 串口读码器参数（日常调参入口，修改后重启节点生效）。
# 默认值取自 Drone-Vision/publish/config.json 的 barcode_decoder.serial_reader。

# 40pin UART1_M1（板卡 RX=27 / TX=28），需启用 uart1-m1 覆盖。
port: /dev/ttyS1
baud: 115200
data_bits: 8
parity: None      # None/Even/Odd/Mark/Space
stop_bits: One    # One/OnePointFive/Two

# 触发 / 释放指令（HEX）。trigger_hex 置空时改用文本指令 trigger_command。
trigger_hex: "02 F4 03"
trigger_command: ""
release_hex: "02 F5 03"

# 回复帧起止符（HEX）。两者都置空 = 纯文本模式，按 CR/LF 判帧（当前读码器返回 "NEXT9017324\r"）。
reply_start_hex: ""
reply_end_hex: ""

# 读不到码时读码器的回复，去掉首尾空白后完全相同即判为 no_read（读码失败）；置空则不识别。
# 实测读码器自身约 3 s 读不到才回 "NR\r"。
no_read_reply: "NR"

# 单次读码超时（毫秒）。2026-10-08 实测：读到时 0.5~2.7 s 回码，读不到时读码器自己约 3.02~3.05 s 回 NR。
# 取 3500：慢一点的成功不会被判 timeout，读不到时能拿到 no_read 而不是 timeout。
read_timeout_ms: 3500

# 相机静态 TF（base_frame -> camera_frame）参数。
# 由 front_camera_static_tf 节点读取，替换原 launch 命令行数值。

# 父坐标系（机体）
base_frame: drone_base
# 子坐标系（相机光轴系）
camera_frame: usb_camera_optical_frame

# 相机原点在 base_frame 下的平移（m）：相机位于 drone_base 前方 0.18 m，光轴朝前
translation: [0.18, 0.0, 0.0]

# 旋转四元数（x, y, z, w）：drone_base -> 光学系（z 前变 x 前）旋转
rotation_quaternion: [-0.5, 0.5, -0.5, 0.5]

# front_marker_control 节点运行参数（日常调参唯一入口，修改后重启生效）。
# launch 不再重复这些默认值；节点代码中的默认值仅作兜底。
# 场景差异（RViz 可视化关闭 yaw 控制）见 config/front_marker_control_rviz.yaml，
# 加载顺序固定为先本文件、后场景文件。

# ---- 目标与坐标系 ----
# Marker 锁定后机体坐标系下的悬停目标位置（m，前 x / 右 y / 下 z）
target_xyz_body: [0.8, 0.0, 0.0]
# TF 坐标系：机体
base_frame: drone_base

# ---- 位置环增益（速度 = kp * 位置误差，1/s） ----
kp_x: 1.50
kp_y: 1.50
kp_z: 1.00
kp_yaw: 0.40
yaw_lpf_tau: 0.20

# ---- 位置低通时间常数（s；0 表示不滤波） ----
position_lpf_tau_x: 0.05
position_lpf_tau_y: 0.00
position_lpf_tau_z: 0.00

# ---- 速度限幅 ----
# 合成 YZ 平面速度限幅：hypot(vy, vz) <= vyz_limit（m/s）
vyz_limit: 0.80
# 前向 x 速度限幅（m/s）
vx_limit: 0.20
yaw_rate_limit: 0.80
# Velocity hysteresis deadbands on the commanded speed (m/s):
#   off = stop producing, on = start producing (on >= off), one pair per axis.

# ---- 速度滞环死区（m/s）：off = 停止输出阈值，on = 恢复输出阈值，on >= off ----
velocity_deadband_off_x: 0.010
velocity_deadband_on_x: 0.015
velocity_deadband_off_y: 0.004
velocity_deadband_on_y: 0.007
velocity_deadband_off_z: 0.003
velocity_deadband_on_z: 0.006
yaw_error_deadband: 0.06

# ---- 输出开关 ----
# 是否启用 yaw 控制（RViz 场景在 front_marker_control_rviz.yaml 中关闭）
enable_yaw_control: true
# yaw 来源（enable_yaw_control=true 时生效）：
#   fixed_face（默认）：yaw 只用定位锁到货架朝向（face_yaws_deg），tag 只管 XYZ；
#     流程 ALIGN -> POS_HOLD：XYZ 对准且 yaw 到位持续 aligned_hold_sec、机体速度
#     低于 lock_max_speed_mps 后，取对准窗口内 Marker 位置中位数锁定悬停点。
#   marker：原流程，ALIGN 用 tag yaw 发 yaw 角速度，再走 3 秒采样与 POSE_ALIGNING。
yaw_mode: fixed_face
# 是否向 MAVROS 发布 setpoint 输出（false 时仅计算不输出）
enable_setpoint_output: true
# 是否启用位置锁定（ALIGN -> POS_HOLD）与近墙后退（RETREAT）
# （RViz 可视化场景无真实飞机/定位，在 front_marker_control_rviz.yaml 中显式关闭）
enable_position_hold: true
# setpoint 发布频率（Hz）
setpoint_publish_rate_hz: 20.0

# ---- 加速度限制与丢标减速 ----
# 正常逼近加速度上限（m/s^2）
max_accel: 0.50
# 丢失目标后的减速加速度（m/s^2）
loss_decel: 1.00

# ---- 超时（s） ----
# Marker 位姿超时视为丢失
pose_timeout_sec: 0.1
# 位姿时间戳过旧即拒绝（延迟上限）
max_pose_latency_sec: 0.5
# 位姿滤波最大积分步长
filter_dt_max_sec: 0.5
# MAVROS state 超时（/mavros/state 心跳约 1 Hz，预留抖动裕量）
state_timeout_sec: 2.0
# 允许的未来时间戳容差
future_stamp_tolerance_sec: 0.1
# TF 查询超时
tf_lookup_timeout_sec: 0.05

# ---- 输入/输出话题 ----
pose_topic: /front_marker/pose
state_topic: /mavros/state
setpoint_raw_topic: /mavros/setpoint_raw/local
position_error_topic: /front_marker_control/position_error
yaw_error_topic: /front_marker_control/yaw_error
command_topic: /front_marker_control/cmd_vel
setpoint_preview_topic: /front_marker_control/setpoint_preview
status_topic: /front_marker_control/status
# 控制模式（std_msgs/String，latch，仅在模式变化时发布）：ALIGN / YAW_SAMPLING /
# POSE_ALIGNING / POS_HOLD / RETREAT，供到位自动读码等下游按跳变触发。
control_mode_topic: /front_marker_control/control_mode

# ---- 对准判据 ----
# 侧向/垂向/距离对准容差（m）
lateral_tolerance_m: 0.08
vertical_tolerance_m: 0.08
distance_tolerance_m: 0.12
# yaw 对准容差（deg）：marker 模式比 tag yaw；fixed_face 模式比机体 yaw 与货架朝向
yaw_tolerance_deg: 6.0
# 全部对准后的保持时长（s）
aligned_hold_sec: 1.0

# ---- fixed_face 货架朝向（yaw_mode=fixed_face 时生效）----
# 货架朝向，local ENU yaw（deg）。v0 约定：起飞前机头正对第一面货架摆放，
# 此时 FAST-LIO/PX4 的 local yaw 约为 0，背后那面货架为 180。
face_yaws_deg: [0.0, 180.0]
# 每次切入 OFFBOARD 选离当前航向最近的朝向并锁定到退出 OFFBOARD；
# 偏差超过该值（deg）不进场，输出零速度（WAIT_FACE_YAW）
face_yaw_max_offset_deg: 30.0
# yaw 设定从当前航向转到货架朝向的速率（deg/s），避免切入瞬间的 yaw 阶跃
face_yaw_rate_deg_s: 10.0
# 锁定悬停点时机体速度上限（m/s）；对准已满保持时间但速度超限时显示 WAIT_STILL
lock_max_speed_mps: 0.05
# 锁定所需的最少 Marker 帧数（对准窗口内，能与定位配对的帧）
lock_min_samples: 5

# ---- 位置锁定与近墙保护（enable_position_hold=true 时生效）----
# 定位输入话题（Odometry，body 在 local ENU 的位姿）
odom_topic: /mavros/local_position/odom
# 定位接收超时（s）：超过视为定位失效
odom_timeout_sec: 0.20
# 定位插值最大样本间隔（s）
odom_interp_gap_max_sec: 0.10
# 定位源时间戳最大允许年龄（s）：超龄/重放帧一律拒绝
odom_source_max_age_sec: 0.50
# POS_HOLD 退出带宽（m/deg，须 >= 对准进入带宽）。fixed_face/off 下只比 XYZ，
# 超限持续 pos_exit_hold_sec 退回 ALIGN；marker 流程锁定后不按视觉退出。
pos_exit_distance_tolerance_m: 0.18
pos_exit_lateral_tolerance_m: 0.12
pos_exit_vertical_tolerance_m: 0.12
pos_exit_yaw_tolerance_deg: 9.0
# 视觉误差超限需连续保持的时间（s）才退出 POS_HOLD
pos_exit_hold_sec: 1.0
# 近墙保护：机体坐标系前向 x（Marker 相对 drone_base 的前向坐标，
# 未低通滤波的位置观测）小于该值（m）即退出对准/位置保持并后退
# （须小于 target_xyz_body[0]）。0.50 m 为初始调试门限而非硬限位：
# 按机体中心到桨尖约 0.25 m 计，正对墙面触发时约剩 0.25 m 桨尖间隙，
# 视觉延迟、惯性与制动响应仍会消耗该间隙。
min_marker_distance_m: 0.50
# 后退后重新对准的 Marker 距离（m，须大于 min_marker_distance_m）
retreat_recover_distance_m: 0.70
# 后退速度（m/s，须为负）
retreat_velocity_x: -0.10

# ---- 固定 3 秒采样与最终 XYZ+yaw 精对准 ----
# 仅 yaw_mode=marker 且 enable_position_hold=true 时生效。
# XYZ 进入容差即开始固定 3 秒计时：缺帧、速度超限、XYZ 偏离均不暂停、
# 不清零；截止周期用窗口内全部可配对样本计算固定 XYZ+yaw 目标。
yaw_sampling_duration_sec: 3.0
# 等待源时间戳两侧 Odometry 的最长接收时间（s），不外推；超时丢弃该帧。
yaw_sample_pending_timeout_sec: 0.50
# 最终位置 SP 使用静止到静止梯形速度轨迹，yaw 走圆周最短方向。
pose_transition_speed_mps: 0.10
pose_transition_accel_mps2: 0.50
pose_transition_yaw_rate_deg_s: 10.0
fixed_yaw_target_topic: /front_marker_control/fixed_yaw_target

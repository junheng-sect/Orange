# vz_chirp_control 公共运行参数（控制器与记录器共用同一包配置中的公共值）。
# 控制器读取"扫频 profile"部分，记录器读取"记录"部分。

# ---- 控制输出开关 ----
# 是否向 MAVROS 发布 setpoint 输出（false 时只计算不输出）
enable_setpoint_output: true

# ---- 扫频 profile ----
# setpoint 发布频率（Hz）
publish_rate_hz: 100.0
# 正弦扫频速度幅值（m/s）
amplitude_mps: 0.20
# 起始频率（Hz）
start_frequency_hz: 0.20
# 终止频率（Hz）
end_frequency_hz: 8.0
# 扫频总时长（s）
sweep_duration_sec: 60.0
# 首尾幅值渐变时长（s）
fade_duration_sec: 2.0
# 进入 OFFBOARD 后的稳定时长（s）
stabilize_duration_sec: 3.0
# 扫频结束后的保持时长（s）
post_hold_duration_sec: 5.0

# ---- MAVLink 遥测与质量门禁 ----
# 请求的遥测频率（Hz）
requested_telemetry_rate_hz: 100.0
# 遥测频率下限（Hz），低于则判为故障
minimum_data_rate_hz: 90.0
# 频率统计窗口（s）
rate_window_sec: 2.0
# 频率故障持续多久后终止（s）
rate_fault_hold_sec: 1.0
# 话题数据最大年龄（s）
maximum_topic_age_sec: 0.10
# MAVROS state 超时（s）
state_timeout_sec: 2.5

# ---- 室内安全包线 ----
# 垂直偏移上限（m）
maximum_vertical_offset_m: 0.45
# 垂直总行程上限（m，峰峰值）
maximum_vertical_span_m: 0.80
# 垂直速度绝对值上限（m/s）
maximum_absolute_vz_mps: 0.60
# 水平误差上限（m）
maximum_xy_error_m: 0.30

# ---- 会话结束后恢复的常态遥测频率（Hz） ----
restore_local_position_rate_hz: 30.0
restore_target_local_rate_hz: 10.0

# ---- 话题 ----
state_topic: /mavros/state
odom_topic: /mavros/local_position/odom
velocity_topic: /mavros/local_position/velocity_local
target_topic: /mavros/setpoint_raw/target_local
setpoint_topic: /mavros/setpoint_raw/local
status_topic: /vz_chirp/status

# ---- 记录器（vz_chirp_bag_recorder） ----
# 是否要求录包器健康联锁（true 时录包失败/不录制会 ABORT 并保持位置）
recorder_required: true
# 录包器健康消息超时（s）
recorder_health_timeout_sec: 1.0
# 录包器健康消息话题（VzRecorderHealth，~2 Hz latched）
recorder_health_topic: /vz_chirp/recorder_health
# rosbag 输出根目录
bag_directory: /home/vslam/seeker/logs/vz_chirp
# bag 路径发布话题（String，latched）
bag_path_topic: /vz_chirp/bag_path

# 相机读码参数（decode_image 和 ROS 节点共用，修改后重启节点生效）。
# 结构与 Drone-Vision config.json 的 tag / detector / barcode_decoder 一致，默认值取自板端 publish/config.json。

# 标签版式（tag 边长、标签纸宽高、tag 位置/偏移、formats、expected_codes）不在这里，
# 见 config/layouts/<名字>.yaml，启动时用 layout:=<名字> 选择；节点没给版式时用代码默认值。
tag:
  family: tag36h11
  roi_scale: 1.25              # ROI 边长 = 标签尺寸 × roi_scale

detector:                      # 只在 decode_image 自己检测 tag 时使用；ROS 节点用 /front_marker/pose
  quad_decimate: 1.5
  nthreads: 4
  refine_edges: true

barcode_decoder:
  enabled: true
  roi_2d_scale: 512            # ROI 2D 小图通道目标边长（px），DM 对模块像素数敏感
  preprocess:
    enabled: true
    clahe:
      enabled: true
      clip_limit: 2.0
      grid_size: 8
  decoder:
    try_rotate: true
  pyramid:                     # 第一帧的整图金字塔（整幅缩到 1280 / 1920 / 原图三层扫描）
    with_tag: false            # 有 tag ROI 时是否跑：false 只跑标签 ROI，读不出直接换帧；没有 tag 时总是跑
                               # 2026-10-15 关：97 次读码里整图金字塔一次没读出；4224×3136 下首帧读不出时它要多花约 240 ms
                               # （20 张实飞模糊帧离线测，首帧 642→400 ms，剩下主要是去畸变）。ROI 切不准时改回 true
  retry:                       # 第一帧没读齐时换新帧重试：每帧用自己的 tag 位姿，只跑标签 ROI（WARP/ROI）
    timeout_ms: 2000           # 解码开始后多久停止重试（含第一帧），0 = 不重试
  undistort:
    enabled: false             # 2D 没读齐时，整幅去畸变后再扫一次（需要 CameraInfo）
                               # 2026-10-15 关：4224×3136 下每次约 370 ms（几乎全是 cv::undistort 本身），关后首帧读不出 400→26 ms，
                               # 省下的时间留给换帧重试；97 次读码里只读出过 1 次（10.14 手动悬停，2560）。ROI 切不准时与 pyramid 一起改回 true

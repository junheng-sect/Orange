# 遥控器开关触发读码（日常调参入口，修改后重启节点生效）。
# 触发判据沿用 9.1 CH9 弹簧开关拍照：低于 arm_below 布防，高于 trigger_above 持续 hold_s 触发一次。

rc_topic: /mavros/rc/in
rc_channel: 9          # 1-based：9 = 遥控器 CH9（/mavros/rc/in 的 channels[8]）
arm_below: 1600        # us
trigger_above: 1700    # us
hold_s: 0.05           # 高位持续多久才算一次拨杆（去抖）
rc_timeout_s: 1.0      # 超过这么久收不到有效 CH9 视为 RC 丢失并撤防

# mode 用 launch 参数 mode:= 指定（camera 默认 / serial / both）；
# 串口读码器参数在 serial.yaml，只在 mode 为 serial / both 时加载，camera 模式下终端不出现串口相关内容。
camera_service: /barcode_reader_camera/decode
service_wait_s: 0.5    # 服务不在线时最多等多久，超时跳过该读码器

# ---- tag 位置记录（看在什么位置能读成功）----
# 每次拨杆把 tag 位置（相机光学系 x 右/y 下/z 前，m）写进汇总日志；留空则不记录位置
transform_topic: /ov13855_apriltag_vision/debug/homogeneous_transform
tag_timeout_s: 0.5     # 拨杆时刻最新一帧 tag 超过这么久视为看不到 tag
# 每次拨杆往 rc_read.csv 追加一行，放在相机读码节点这次启动的文件夹里（和图片、attempts.csv 一起）；
# 只跑 serial 时在 csv_dir 下按启动时间另建文件夹。第一次拨杆才建文件。留空不写
csv_dir: ~/test_data/barcode

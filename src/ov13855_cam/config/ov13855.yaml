# OV13855 RKISP 自通路：整幅 4224×3136 由 ISP 硬件缩到 1280×960，供 AprilTag 跟踪；不设置 UVC 曝光/增益。
# 全分辨率主通路见 ov13855_full.yaml（读码用），两路同一传感器帧、视场相同。
video_device: /dev/video12
image_width: 1280
image_height: 960
framerate: 15
camera_name: ov13855_1280x960
camera_frame_id: ov13855_optical_frame
camera_info_url: package://ov13855_cam/config/ov13855_1280x960.yaml
image_topic: /ov13855/image_raw
camera_info_topic: /ov13855/camera_info
# 发布 NV12 的 Y 平面（亮度）作为 mono8；不翻转，不缩放采集图像。
frame_timeout_sec: 5.0

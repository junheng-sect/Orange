<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小车控制台</title>
<style>
  :root {
    --bg: #1e2227; --panel: rgba(30, 34, 39, 0.92); --chip: #2b3138; --line: #3a4048;
    --fg: #e6e6e6; --muted: #9aa4ae; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --ctl-h: 65px;  /* 底部按钮栏高度，上面浮着的控件都按它往上排 */
  }
  /* 手机竖屏一行放不下 8 个按钮：停止占两行，其余按钮排成两行。 */
  @media (max-width: 600px) {
    :root { --ctl-h: 110px; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  #map { position: fixed; inset: 0; display: block; touch-action: none; }
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .chip {
    padding: 3px 8px; border-radius: 12px; background: var(--chip); white-space: nowrap;
    font-variant-numeric: tabular-nums; box-shadow: inset 3px 0 var(--line);
  }
  .chip b { color: var(--muted); font-weight: normal; margin-right: 4px; }
  .chip.ok { box-shadow: inset 3px 0 var(--ok); }
  .chip.warn { box-shadow: inset 3px 0 var(--warn); }
  .chip.bad { box-shadow: inset 3px 0 var(--bad); }
  #tools { position: fixed; right: 12px; bottom: calc(var(--ctl-h) + 11px); z-index: 2; display: flex; flex-direction: column; gap: 8px; }
  #tools button, #layers button {
    border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; cursor: pointer;
  }
  #tools button { width: 48px; height: 48px; border-radius: 24px; font-size: 13px; }
  #tools button.on { border-color: var(--ok); color: var(--ok); }
  #layers {
    position: fixed; right: 70px; bottom: calc(var(--ctl-h) + 11px); z-index: 2; display: none; min-width: 180px;
    padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  #layers.open { display: block; }
  #layers label { display: block; padding: 4px 0; cursor: pointer; }
  #layers small { color: var(--muted); }
  #layers .row { display: flex; gap: 8px; margin-top: 6px; }
  #layers button { flex: 1; padding: 6px; border-radius: 6px; }
  #toast {
    position: fixed; left: 12px; bottom: calc(var(--ctl-h) + 39px); z-index: 2; max-width: 60%;
    color: var(--bad); font-size: 13px;
  }
  #toast.info { color: var(--fg); }
  #ctl {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; height: var(--ctl-h); display: grid;
    grid-template-columns: 1.6fr repeat(7, 1fr); grid-auto-rows: 1fr; gap: 6px; padding: 8px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  @media (max-width: 600px) {
    #ctl { grid-template-columns: 1.3fr repeat(4, 1fr); }
    #ctl #b-stop { grid-row: span 2; }
  }
  #ctl button, .sheet button {
    border: 1px solid var(--line); background: var(--chip); color: var(--fg); font: inherit; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  #ctl button { min-width: 0; padding: 0 2px; border-radius: 8px; }
  #ctl button.on { border-color: var(--ok); color: var(--ok); }
  #ctl #b-stop { background: #b62324; border-color: var(--bad); color: #fff; font-size: 17px; font-weight: 600; }
  .sheet {
    position: fixed; left: 8px; right: 8px; bottom: calc(var(--ctl-h) + 7px); z-index: 3; display: none; max-width: 420px; margin: 0 auto;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .sheet.open { display: block; }
  .sheet h3 { margin: 0 0 6px; font-size: 15px; }
  .sheet .row { display: flex; gap: 8px; margin-top: 8px; }
  .sheet button { flex: 1; height: 42px; border-radius: 8px; }
  .sheet button.go { background: #1f6f3a; border-color: var(--ok); }
  .sheet button.go.danger { background: #8a5a00; border-color: var(--warn); }
  .sheet button:disabled { opacity: 0.4; cursor: default; }
  #point-list button { display: block; width: 100%; margin-top: 6px; padding: 0 10px; text-align: left; }
  #rl-info { white-space: pre-line; }
  .ok-t { color: var(--ok); }
  .warn-t { color: var(--warn); }
  .bad-t { color: var(--bad); }
  .mute-t { color: var(--muted); }
  #joy {
    position: fixed; left: 16px; bottom: calc(var(--ctl-h) + 31px); z-index: 3; display: none; width: 160px; height: 160px;
    border-radius: 50%; background: rgba(43, 49, 56, 0.85); border: 2px solid var(--line); touch-action: none;
  }
  #joy.open { display: block; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: #2f81f7; pointer-events: none;
  }
  #joy-speed {
    position: absolute; left: 50%; top: -40px; transform: translateX(-50%); padding: 4px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="bar">
  <span class="chip" id="c-conn"><b>连接</b>—</span>
  <span class="chip" id="c-batt"><b>电量</b>—</span>
  <span class="chip" id="c-chg"><b>充电</b>—</span>
  <span class="chip" id="c-loc"><b>定位</b>—</span>
  <span class="chip" id="c-score" hidden><b>分数</b>—</span>
  <span class="chip" id="c-nav"><b>导航</b>—</span>
  <span class="chip" id="c-vel"><b>速度</b>—</span>
  <span class="chip" id="c-pose"><b>位姿</b>—</span>
  <span class="chip" id="c-cur"><b>光标</b>—</span>
</div>
<div id="tools">
  <button id="b-follow">跟随</button>
  <button id="b-fit">全图</button>
  <button id="b-rot">旋转</button>
  <button id="b-layers">图层</button>
</div>
<div id="layers">
  <div id="layer-list"></div>
  <div class="row"><button id="b-trail">清轨迹</button><button id="b-points">刷新点位</button></div>
</div>
<div id="toast"></div>
<div id="ctl">
  <button id="b-stop">停止</button>
  <button id="b-pause">暂停</button>
  <button id="b-resume">继续</button>
  <button id="b-goal">设目标</button>
  <button id="b-nav">点位</button>
  <button id="b-joy">摇杆</button>
  <button id="b-reloc">重定位</button>
  <button id="b-charge">回充</button>
</div>
<div class="sheet" id="confirm">
  <h3 id="cf-title">—</h3>
  <div id="cf-info">规划中…</div>
  <div class="row"><button id="cf-cancel">取消</button><button class="go" id="cf-go" disabled>出发</button></div>
</div>
<div class="sheet" id="points">
  <h3>去已存点位</h3>
  <div id="point-list"></div>
  <div class="row"><button id="pt-close">关闭</button></div>
</div>
<div class="sheet" id="reloc">
  <h3>重定位</h3>
  <div id="rl-info">—</div>
  <div class="row">
    <button id="rl-cancel">取消</button><button id="rl-raw">按拖的位姿</button><button class="go" id="rl-go">按微调后</button>
  </div>
</div>
<div id="joy"><div id="knob"></div><button id="joy-speed">慢速</button></div>
<script src="config.local.js"></script>
<script src="app.js"></script>
</body>
</html>
